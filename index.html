<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Praxis 5941 History Quiz</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; background: #121212; color: #f1f1f1; }
    .study-controls { display: flex; align-items: end; gap: 16px; margin-bottom: 14px; padding: 16px; background: #1e1e1e; border: 1px solid #333; border-radius: 10px; }
    .control-group { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .control-group label { font-size: 0.85rem; color: #90caf9; }
    #domain-filter { width: 100%; padding: 10px 12px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; font-size: 0.95rem; }
    .shuffle-control { display: flex; align-items: center; gap: 8px; min-height: 42px; color: #f1f1f1; white-space: nowrap; cursor: pointer; }
    .shuffle-control input { width: 18px; height: 18px; accent-color: #1976d2; cursor: pointer; }
    @media (max-width: 600px) { .study-controls { flex-direction: column; align-items: stretch; } }
    .card { background: #1e1e1e; padding: 24px; border-radius: 10px; border: 1px solid #333; }
    .badge { font-size: 0.85rem; color: #90caf9; margin-bottom: 8px; display: block; }
    .option { display: block; width: 100%; text-align: left; padding: 12px 16px; margin: 10px 0; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .option:hover:not(:disabled) { background: #383838; }
    .correct { background: #1b5e20 !important; border-color: #4caf50 !important; }
    .wrong { background: #b71c1c !important; border-color: #ef5350 !important; }
    #explanation { margin-top: 16px; padding: 14px; background: #263238; border-left: 4px solid #4fc3f7; display: none; }
    #next-btn { margin-top: 18px; padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 6px; cursor: pointer; display: none; font-size: 1rem; }
    .results-summary { margin: 12px 0 20px; }
    .results-score { font-size: 1.35rem; margin: 10px 0 18px; }
    .domain-breakdown { margin: 0; padding: 0; list-style: none; border-top: 1px solid #333; }
    .domain-breakdown li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid #333; }
    .domain-breakdown .domain-name { color: #d9d9d9; }
    .domain-breakdown .domain-score { color: #90caf9; font-weight: 700; white-space: nowrap; }
    #restart-btn { margin-top: 4px; padding: 10px 20px; background: #1976d2; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="study-controls" aria-label="Study controls">
    <div class="control-group">
      <label for="domain-filter">Domain Filter</label>
      <select id="domain-filter">
        <option value="all">All Domains (120)</option>
        <option value="us-all">U.S. History (All)</option>
        <option value="world-all">World History (All)</option>
        <option value="US-to-1877">U.S. History to 1877</option>
        <option value="US-from-1877">U.S. History 1877–Present</option>
        <option value="world-to-1450">World History to 1450</option>
        <option value="world-from-1450">World History 1450–Present</option>
      </select>
    </div>
    <label class="shuffle-control" for="shuffle-toggle">
      <input type="checkbox" id="shuffle-toggle" />
      <span>Shuffle Questions</span>
    </label>
  </div>
  <div class="card">
    <span class="badge" id="progress">Loading...</span>
    <h2 id="question-text"></h2>
    <div id="options-container"></div>
    <div id="explanation"></div>
    <button id="next-btn">Next Question →</button>
  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
